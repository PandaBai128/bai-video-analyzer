name: 使用问题
description: 报告无法分析、字幕获取、导航、问答或模型兼容问题
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要粘贴 API Key、Cookie、Token、私人笔记或完整字幕。
  - type: dropdown
    id: platform
    attributes:
      label: 视频平台
      options:
        - 哔哩哔哩
        - YouTube
        - 其他
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: 视频链接
      description: 如果方便公开，请提供可复现的视频链接。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      placeholder: 说明你执行的操作、实际结果和期望结果。
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 使用的模型
      placeholder: 例如 bAI 免费服务 / MiniMax / 其他兼容接口
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可提供已隐藏敏感信息的截图或错误提示。
